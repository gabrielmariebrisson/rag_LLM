version: '3.8'

services:
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    ports:
      - "16686:16686"  # UI Jaeger
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    networks:
      - rag-network

  vllm-service:
      image: vllm/vllm-openai:latest
      container_name: vllm-service
      ports:
        - "8001:8000"
      volumes:
        - /workspace/huggingface_cache:/root/.cache/huggingface
      command:
        - --model
        - casperhansen/llama-3-8b-instruct-awq
        - --quantization
        - awq
        - --dtype
        - float16
        - --max-model-len
        - "4096"
        - --gpu-memory-utilization
        - "0.95"
        - --enforce-eager
        - --port
        - "8000"
        - --host
        - "0.0.0.0"
      deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                count: 1
                capabilities: [gpu]
      environment:
        - CUDA_VISIBLE_DEVICES=0
        - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      restart: unless-stopped
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
        interval: 30s
        timeout: 10s
        retries: 5 
        start_period: 300s
      networks:
        - rag-network

networks:
  rag-network:
    driver: bridge