apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  annotations:
    # Ingress class (à adapter selon votre cluster)
    kubernetes.io/ingress.class: "nginx"
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"  # Pour forcer HTTPS
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  # TLS (optionnel, décommenter et configurer les certificats)
  # tls:
  # - hosts:
  #   - rag.example.com
  #   secretName: rag-tls-secret
  rules:
  - host: rag.example.com  # À remplacer par votre domaine
    http:
      paths:
      # Frontend Streamlit
      - path: /
        pathType: Prefix
        backend:
          service:
            name: rag-frontend
            port:
              number: 8501
      # Backend FastAPI
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: rag-backend
            port:
              number: 8000
      # Jaeger UI (optionnel, pour accès externe)
      - path: /jaeger
        pathType: Prefix
        backend:
          service:
            name: jaeger-service
            port:
              number: 16686

