apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-service
  labels:
    app: vllm-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-service
  template:
    metadata:
      labels:
        app: vllm-service
    spec:
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        ports:
        - containerPort: 8000
          name: http
        command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
        args:
        - --model
        - TheBloke/Mistral-7B-Instruct-v0.2-AWQ
        - --quantization
        - awq
        - --dtype
        - float16
        - --port
        - "8000"
        - --host
        - "0.0.0.0"
        resources:
          limits:
            nvidia.com/gpu: 1
          requests:
            nvidia.com/gpu: 1
        volumeMounts:
        - name: huggingface-cache
          mountPath: /root/.cache/huggingface
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
      volumes:
      - name: huggingface-cache
        persistentVolumeClaim:
          claimName: huggingface-cache-pvc
      # Node selector pour GPU (optionnel)
      # nodeSelector:
      #   accelerator: nvidia-tesla-t4
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-service
  labels:
    app: vllm-service
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: vllm-service
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: huggingface-cache-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
  # storageClassName: fast-ssd  # À adapter selon votre cluster

